<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Microsoft YaHei", sans-serif;
      background: #f6f7f9;
      color: #1f2937;
    }
    header {
      background: #fff;
      border-bottom: 1px solid #e5e7eb;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    header a { color: #2563eb; text-decoration: none; font-size: .95rem; }
    header h1 { font-size: 1.15rem; margin: 0; flex: 1; }
    header .today { color: #6b7280; font-size: .9rem; }
    main { max-width: 960px; margin: 0 auto; padding: 16px; }

    .alerts {
      background: #fffbeb;
      border: 1px solid #fde68a;
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 16px;
    }
    .alerts h2 { font-size: 1rem; margin: 0 0 6px; }
    .alerts ul { margin: 0; padding-left: 18px; }
    .alerts li { margin: 4px 0; font-size: .92rem; }

    .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 16px; }
    @media (max-width: 720px) { .kpis { grid-template-columns: 1fr 1fr; } }
    .kpi {
      background: #fff;
      border: 2px solid transparent;
      border-radius: 12px;
      box-shadow: 0 1px 3px rgba(0,0,0,.08);
      padding: 12px 14px;
      text-align: left;
      cursor: pointer;
      font: inherit;
      color: inherit;
    }
    .kpi:hover { border-color: #bfdbfe; }
    .kpi.active { border-color: #2563eb; }
    .kpi .label { font-size: .85rem; color: #4b5563; }
    .kpi .value { font-size: 1.6rem; font-weight: 700; margin: 4px 0; }
    .kpi .action { font-size: .8rem; color: #6b7280; }
    .kpi.bad .value { color: #dc2626; }

    .filters { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 8px; }
    @media (max-width: 720px) { .filters { grid-template-columns: 1fr 1fr; } }
    .filters label { font-size: .8rem; color: #4b5563; display: block; margin-bottom: 3px; }
    input, select {
      width: 100%;
      padding: 9px 10px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: .95rem;
      font-family: inherit;
      background: #fff;
    }
    input:focus, select:focus { outline: 2px solid #2563eb; border-color: #2563eb; }
    .bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin: 8px 0; }
    .count { color: #6b7280; font-size: .9rem; }
    .chip { background: #eff6ff; color: #1d4ed8; padding: 4px 10px; border-radius: 999px; font-size: .85rem; border: 0; cursor: pointer; }

    .order {
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 1px 2px rgba(0,0,0,.06);
      padding: 12px 14px;
      margin-bottom: 8px;
      border-left: 4px solid transparent;
    }
    .order.late, .order.red { border-left-color: #dc2626; }
    .order.overdue { border-left-color: #f59e0b; }
    .order .top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
    .order .no { font-weight: 700; }
    .order .amt { font-weight: 700; white-space: nowrap; }
    .order .cust { font-weight: 600; margin-top: 2px; }
    .order .line { color: #4b5563; font-size: .9rem; margin-top: 2px; }
    .order .notes { color: #6b7280; font-size: .85rem; margin-top: 4px; word-break: break-word; }
    .badges { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
    .badge { display: inline-block; padding: 3px 8px; border-radius: 999px; font-size: .8rem; font-weight: 600; }
    .b-late, .b-red { background: #dc2626; color: #fff; }
    .b-overdue { background: #f59e0b; color: #fff; }
    .b-today { background: #2563eb; color: #fff; }
    .controls { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 10px; align-items: end; }
    @media (max-width: 560px) { .controls { grid-template-columns: 1fr 1fr; } }
    .controls label { font-size: .8rem; color: #4b5563; display: block; margin-bottom: 3px; }
    .wa {
      display: inline-flex; align-items: center; justify-content: center; gap: 4px;
      padding: 9px 12px; border-radius: 8px; background: #16a34a; color: #fff;
      text-decoration: none; font-weight: 600; font-size: .9rem;
    }
    .saving { opacity: .5; pointer-events: none; }
    .empty { text-align: center; color: #6b7280; padding: 24px 0; }
    .msg { padding: 10px 12px; border-radius: 8px; font-size: .9rem; background: #fef2f2; color: #991b1b; margin-bottom: 12px; }
    .msg.ok { background: #ecfdf5; color: #065f46; }
    .bar .count { flex: 1; }
    button.ai-btn, dialog button {
      padding: 9px 14px; border: 0; border-radius: 8px; background: #2563eb; color: #fff;
      font-size: .9rem; font-weight: 600; cursor: pointer; font-family: inherit;
    }
    dialog button:disabled { opacity: .5; cursor: not-allowed; }
    dialog {
      border: 0; border-radius: 12px; padding: 16px;
      width: calc(100% - 32px); max-width: 640px; max-height: calc(100vh - 32px);
      box-shadow: 0 10px 40px rgba(0,0,0,.2);
    }
    dialog::backdrop { background: rgba(0,0,0,.35); }
    .ai-head { display: flex; justify-content: space-between; align-items: center; }
    .ai-head h2 { margin: 0; font-size: 1.15rem; }
    dialog button.close { background: #e5e7eb; color: #1f2937; padding: 6px 10px; }
    .step { border-top: 1px solid #e5e7eb; margin-top: 14px; padding-top: 12px; }
    .step h3 { font-size: .98rem; margin: 0 0 8px; }
    .hint { color: #6b7280; font-size: .85rem; margin: 0 0 8px; }
    textarea {
      width: 100%; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 8px;
      font-size: .9rem; font-family: inherit; resize: vertical;
    }
    .row-btns { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
    .link-btn {
      padding: 9px 14px; border-radius: 8px; background: #e5e7eb; color: #1f2937;
      text-decoration: none; font-weight: 600; font-size: .9rem;
    }
    .check { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; font-weight: 500; }
    .check input { width: 18px; height: 18px; }
    .brief { border: 1px solid #e5e7eb; border-radius: 8px; padding: 8px 10px; margin-bottom: 6px; }
    .brief summary { cursor: pointer; font-weight: 600; font-size: .9rem; }
    .brief pre { white-space: pre-wrap; word-break: break-word; font-family: inherit; font-size: .88rem; margin: 8px 0 0; }
  </style>
</head>
<body>
  <header>
    <a href="index.html">← 主页</a>
    <h1>Dashboard</h1>
    <span class="today" id="today"></span>
  </header>

  <main hidden id="page">
    <p class="msg" id="pageMsg" hidden></p>

    <section class="alerts" id="alerts" hidden>
      <h2>🔔 今天早上要处理</h2>
      <ul id="alertList"></ul>
    </section>

    <section class="kpis">
      <button class="kpi" data-kpi="late">
        <div class="label">迟到 order</div>
        <div class="value" id="kLate">–</div>
        <div class="action">→ 重新安排罗里</div>
      </button>
      <button class="kpi" data-kpi="overdue">
        <div class="label">过期未收</div>
        <div class="value" id="kOverdue">–</div>
        <div class="action">→ 打电话给客户追钱</div>
      </button>
      <button class="kpi" data-kpi="today">
        <div class="label">今天要送</div>
        <div class="value" id="kToday">–</div>
        <div class="action">→ 确认仓库有货</div>
      </button>
      <button class="kpi" data-kpi="red">
        <div class="label">红色客户</div>
        <div class="value" id="kRed">–</div>
        <div class="action">→ 老板亲自打电话</div>
      </button>
    </section>

    <section class="filters">
      <div>
        <label for="fStatus">送货状态</label>
        <select id="fStatus">
          <option value="active">还要跟进的</option>
          <option value="">全部</option>
        </select>
      </div>
      <div>
        <label for="fPay">付款状态</label>
        <select id="fPay"><option value="">全部</option></select>
      </div>
      <div>
        <label for="fCustomer">客户</label>
        <select id="fCustomer"><option value="">全部</option></select>
      </div>
      <div>
        <label for="fStaff">业务员</label>
        <select id="fStaff"><option value="">全部</option></select>
      </div>
      <div>
        <label for="fFrom">送货日期 从</label>
        <input id="fFrom" type="date">
      </div>
      <div>
        <label for="fTo">到</label>
        <input id="fTo" type="date">
      </div>
    </section>

    <div class="bar">
      <span class="count" id="count"></span>
      <button class="chip" id="clearKpi" hidden>✕ 清除 KPI 筛选</button>
      <button class="ai-btn" id="aiBtn">🤖 AI 早报</button>
    </div>
    <div id="list"></div>
  </main>

  <!-- AI morning brief -->
  <dialog id="aiDialog">
    <div class="ai-head">
      <h2>🤖 AI 早报</h2>
      <button class="close" id="aiClose" aria-label="关闭">✕</button>
    </div>

    <div class="step">
      <h3>1. 复制这段文字</h3>
      <p class="hint" id="aiSource"></p>
      <textarea id="aiPrompt" rows="8" readonly></textarea>
      <div class="row-btns">
        <button type="button" id="aiCopy">📋 复制</button>
        <a class="link-btn" href="https://claude.ai/new" target="_blank" rel="noopener">打开 Claude ↗</a>
      </div>
    </div>

    <div class="step">
      <h3>2. 贴进 Claude，把 Claude 的回答贴在这里</h3>
      <textarea id="aiResult" rows="8" placeholder="把 Claude 的回答贴在这里…"></textarea>
    </div>

    <div class="step">
      <h3>3. 检查，然后保存</h3>
      <label class="check"><input type="checkbox" id="aiChecked"> 我已经检查过，内容是对的</label>
      <button type="button" id="aiSave" disabled>保存早报</button>
      <p class="msg" id="aiMsg" hidden></p>
    </div>

    <div class="step">
      <h3>以前的早报</h3>
      <div id="aiHistory"><p class="hint">载入中…</p></div>
    </div>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    let orders = [];
    let staffNames = {};
    let redDays = 30;
    let kpiFilter = '';
    let today = todayMY();
    let visibleRows = [];

    async function start() {
      const me = await requireRole(['manager', 'owner']);
      if (!me) return;
      $('today').textContent = niceDate(today);

      $('fStatus').insertAdjacentHTML('beforeend',
        Object.entries(STATUS_NAMES).map(([v, t]) => '<option value="' + v + '">' + t + '</option>').join(''));
      $('fPay').insertAdjacentHTML('beforeend',
        Object.entries(PAYMENT_NAMES).map(([v, t]) => '<option value="' + v + '">' + t + '</option>').join(''));

      const [{ data: s }, { data: people }, { data: custs }] = await Promise.all([
        sb.from('settings').select('value').eq('key', 'red_flag_days').maybeSingle(),
        sb.from('profiles').select('id, full_name, email').order('full_name'),
        sb.from('customers').select('id, name').order('name'),
      ]);
      redDays = Number(s && s.value) || 30;
      (people || []).forEach(p => staffNames[p.id] = p.full_name || p.email);
      $('fStaff').insertAdjacentHTML('beforeend',
        (people || []).map(p => '<option value="' + p.id + '">' + escapeHtml(p.full_name || p.email) + '</option>').join(''));
      $('fCustomer').insertAdjacentHTML('beforeend',
        (custs || []).map(c => '<option value="' + c.id + '">' + escapeHtml(c.name) + '</option>').join(''));

      $('page').hidden = false;
      await load();
    }

    async function load() {
      today = todayMY();
      const { data, error } = await sb.from('orders')
        .select('*, customers(name, phone)')
        .order('promised_date', { ascending: true });
      if (error) return showMessage($('pageMsg'), friendlyError(error));
      showMessage($('pageMsg'), '');
      orders = data;
      draw();
    }

    function daysOverdue(o) { return isOverdue(o) ? daysBetween(o.due_date, today) : 0; }
    function isRed(o) { return daysOverdue(o) > redDays; }
    function isDueToday(o) { return o.promised_date === today && !['Delivered', 'Cancelled'].includes(o.status); }

    function draw() {
      // KPIs (always from all orders)
      const late = orders.filter(isLate);
      const overdue = orders.filter(isOverdue);
      const dueToday = orders.filter(isDueToday);
      const red = orders.filter(isRed);
      const redCustomers = new Set(red.map(o => o.customer_id));
      const overdueRM = overdue.reduce((sum, o) => sum + Number(o.amount), 0);

      $('kLate').textContent = late.length;
      $('kOverdue').textContent = money(overdueRM);
      $('kToday').textContent = dueToday.length;
      $('kRed').textContent = redCustomers.size;
      document.querySelector('[data-kpi="late"]').classList.toggle('bad', late.length > 0);
      document.querySelector('[data-kpi="overdue"]').classList.toggle('bad', overdueRM > 0);
      document.querySelector('[data-kpi="red"]').classList.toggle('bad', redCustomers.size > 0);
      document.querySelectorAll('.kpi').forEach(k => k.classList.toggle('active', k.dataset.kpi === kpiFilter));
      $('clearKpi').hidden = !kpiFilter;

      // Morning alerts: late orders + overdue more than red_flag_days
      const alerts = [];
      if (late.length) alerts.push('<b>' + late.length + '</b> 张 order 迟到了 → 重新安排罗里');
      if (red.length) alerts.push('<b>' + red.length + '</b> 张 order 过期超过 ' + redDays + ' 天（'
        + redCustomers.size + ' 个客户）→ 老板亲自打电话');
      $('alerts').hidden = !alerts.length;
      $('alertList').innerHTML = alerts.map(a => '<li>' + a + '</li>').join('');

      // List
      const fs = $('fStatus').value, fp = $('fPay').value, fc = $('fCustomer').value,
            fu = $('fStaff').value, from = $('fFrom').value, to = $('fTo').value;
      const rows = orders.filter(o => {
        if (kpiFilter === 'late' && !isLate(o)) return false;
        if (kpiFilter === 'overdue' && !isOverdue(o)) return false;
        if (kpiFilter === 'today' && !isDueToday(o)) return false;
        if (kpiFilter === 'red' && !redCustomers.has(o.customer_id)) return false;
        if (kpiFilter === 'red' && !isOverdue(o)) return false;
        if (fs === 'active' && (o.status === 'Cancelled' || (o.status === 'Delivered' && o.payment_status === 'Paid'))) return false;
        if (fs && fs !== 'active' && o.status !== fs) return false;
        if (fp && o.payment_status !== fp) return false;
        if (fc && o.customer_id !== fc) return false;
        if (fu && o.created_by !== fu) return false;
        if (from && o.promised_date < from) return false;
        if (to && o.promised_date > to) return false;
        return true;
      });

      // Most urgent first: red, late, overdue, due today, then by promised date
      const rank = o => isRed(o) ? 0 : isLate(o) ? 1 : isOverdue(o) ? 2 : isDueToday(o) ? 3 : 4;
      rows.sort((a, b) => rank(a) - rank(b) || a.promised_date.localeCompare(b.promised_date));

      visibleRows = rows;
      $('count').textContent = '共 ' + rows.length + ' 张单';
      $('list').innerHTML = rows.length ? rows.map(card).join('') : '<p class="empty">这里没有单。</p>';
    }

    function card(o) {
      const late = isLate(o), overdue = isOverdue(o), red = isRed(o), todayDue = isDueToday(o);
      const cls = red ? 'red' : late ? 'late' : overdue ? 'overdue' : '';
      const badges = [
        red ? '<span class="badge b-red">红色 · 过期 ' + daysOverdue(o) + ' 天</span>'
            : overdue ? '<span class="badge b-overdue">过期 ' + daysOverdue(o) + ' 天</span>' : '',
        late ? '<span class="badge b-late">迟到 ' + daysBetween(o.promised_date, today) + ' 天</span>' : '',
        todayDue ? '<span class="badge b-today">今天要送</span>' : '',
      ].join('');

      const statusOpts = Object.entries(STATUS_NAMES).map(([v, t]) =>
        '<option value="' + v + '"' + (v === o.status ? ' selected' : '') + '>' + t + '</option>').join('');
      const payOpts = Object.entries(PAYMENT_NAMES).map(([v, t]) =>
        '<option value="' + v + '"' + (v === o.payment_status ? ' selected' : '') + '>' + t + '</option>').join('');

      const c = o.customers || {};
      let wa = '';
      if (overdue && c.phone) {
        const text = 'Hello ' + c.name + ', this is a friendly reminder that order ' + o.order_no
          + ' (' + money(o.amount) + ') was due on ' + niceDate(o.due_date)
          + '. Please arrange payment at your earliest convenience. Thank you!';
        wa = '<a class="wa" target="_blank" rel="noopener" href="' + escapeHtml(whatsappLink(c.phone, text)) + '">WhatsApp 追钱</a>';
      }

      return '<div class="order ' + cls + '" data-id="' + o.id + '">'
        + '<div class="top"><span class="no">' + escapeHtml(o.order_no) + '</span>'
        + '<span class="amt">' + money(o.amount) + '</span></div>'
        + '<div class="cust">' + escapeHtml(c.name) + (c.phone ? ' · ' + escapeHtml(c.phone) : '') + '</div>'
        + '<div class="line">' + escapeHtml(o.item) + ' · ' + Number(o.qty) + ' × ' + money(o.unit_price) + '</div>'
        + '<div class="line">答应送货：' + niceDate(o.promised_date)
        + (o.delivered_date ? ' · 送到：' + niceDate(o.delivered_date) : '')
        + ' · 业务员：' + escapeHtml(staffNames[o.created_by] || '—') + '</div>'
        + (o.notes ? '<div class="notes">' + escapeHtml(o.notes) + '</div>' : '')
        + (badges ? '<div class="badges">' + badges + '</div>' : '')
        + '<div class="controls">'
        + '<div><label>送货状态</label><select data-field="status">' + statusOpts + '</select></div>'
        + '<div><label>付款状态</label><select data-field="payment_status">' + payOpts + '</select></div>'
        + '<div><label>付款到期日</label><input type="date" data-field="due_date" value="' + (o.due_date || '') + '"></div>'
        + (wa ? '<div>' + wa + '</div>' : '')
        + '</div></div>';
    }

    // Save a status / payment / due date change straight away
    $('list').addEventListener('change', async (e) => {
      const field = e.target.dataset.field;
      if (!field) return;
      const box = e.target.closest('.order');
      const value = e.target.value || null;
      box.classList.add('saving');
      const { error } = await sb.from('orders').update({ [field]: value }).eq('id', box.dataset.id);
      if (error) alert(friendlyError(error));
      await load();
    });

    // ---------- AI morning brief ----------
    // Builds a prompt from the rows on screen. No AI key here: the manager runs it in Claude.
    const MAX_BRIEF_ROWS = 80;

    function buildPrompt(rows) {
      const lines = rows.slice(0, MAX_BRIEF_ROWS).map(o => {
        const flags = [
          isRed(o) ? '红色(过期' + daysOverdue(o) + '天)' : isOverdue(o) ? '过期' + daysOverdue(o) + '天' : '',
          isLate(o) ? '迟到' + daysBetween(o.promised_date, today) + '天' : '',
          isDueToday(o) ? '今天要送' : '',
        ].filter(Boolean).join('，');
        return '- ' + o.order_no + ' | 客户：' + (o.customers && o.customers.name || '')
          + ' | ' + o.item + ' × ' + Number(o.qty) + ' | ' + money(o.amount)
          + ' | 答应送货：' + niceDate(o.promised_date)
          + ' | 送货：' + o.status + ' | 付款：' + o.payment_status
          + (o.due_date ? ' | 付款到期：' + niceDate(o.due_date) : '')
          + (flags ? ' | ⚠ ' + flags : '');
      });
      const more = rows.length > MAX_BRIEF_ROWS ? '\n（另外还有 ' + (rows.length - MAX_BRIEF_ROWS) + ' 张单没列出）' : '';

      return '你是我公司的运营助手。今天是 ' + niceDate(today) + '。\n'
        + '下面是今天早上 Dashboard 上的 order（共 ' + rows.length + ' 张）。\n\n'
        + '规则：\n'
        + '- 迟到 = 答应送货日期已经过了，但还没送到\n'
        + '- 过期 = 付款到期日已经过了，但还没付清\n'
        + '- 红色 = 过期超过 ' + redDays + ' 天，要老板亲自打电话\n\n'
        + 'Order：\n' + (lines.join('\n') || '（没有 order）') + more + '\n\n'
        + '请用简单的中文，给我一份今天早上的行动清单：\n'
        + '1. 先送货给谁（按先后排，说原因）\n'
        + '2. 先追谁的钱（按先后排，写金额和过期天数）\n'
        + '3. 老板要亲自打给哪些客户\n'
        + '4. 今天要送的单，提醒确认 stock\n\n'
        + '只用上面的资料，不要猜没有给你的东西。不要替我发任何消息给客户。';
    }

    async function loadHistory() {
      const { data, error } = await sb.from('ai_briefs')
        .select('id, created_at, created_by, result').order('created_at', { ascending: false }).limit(10);
      if (error) return $('aiHistory').innerHTML = '<p class="hint">' + escapeHtml(friendlyError(error)) + '</p>';
      $('aiHistory').innerHTML = data.length ? data.map(b =>
        '<details class="brief"><summary>' + niceDate(b.created_at) + ' · '
        + escapeHtml(staffNames[b.created_by] || '') + '</summary><pre>' + escapeHtml(b.result) + '</pre></details>'
      ).join('') : '<p class="hint">还没有保存过早报。</p>';
    }

    function updateSaveBtn() {
      $('aiSave').disabled = !($('aiChecked').checked && $('aiResult').value.trim());
    }

    $('aiBtn').onclick = () => {
      $('aiPrompt').value = buildPrompt(visibleRows);
      $('aiSource').textContent = '根据画面上现在显示的 ' + visibleRows.length + ' 张单。想要别的单，先关掉这个窗口，改上面的筛选。';
      $('aiResult').value = '';
      $('aiChecked').checked = false;
      updateSaveBtn();
      showMessage($('aiMsg'), '');
      $('aiDialog').showModal();
      loadHistory();
    };

    $('aiCopy').onclick = async () => {
      try {
        await navigator.clipboard.writeText($('aiPrompt').value);
      } catch (e) {
        $('aiPrompt').select();
        document.execCommand('copy');
      }
      $('aiCopy').textContent = '✅ 已复制';
      setTimeout(() => $('aiCopy').textContent = '📋 复制', 2000);
    };

    $('aiResult').oninput = updateSaveBtn;
    $('aiChecked').onchange = updateSaveBtn;
    $('aiClose').onclick = () => $('aiDialog').close();

    $('aiSave').onclick = async () => {
      if (!$('aiChecked').checked) return showMessage($('aiMsg'), '请先勾"我已经检查过"。');
      $('aiSave').disabled = true;
      const { error } = await sb.from('ai_briefs').insert({
        prompt: $('aiPrompt').value,
        result: $('aiResult').value.trim(),
        checked: true,
      });
      if (error) {
        updateSaveBtn();
        return showMessage($('aiMsg'), friendlyError(error));
      }
      showMessage($('aiMsg'), '✅ 早报已保存。', 'ok');
      $('aiResult').value = '';
      $('aiChecked').checked = false;
      updateSaveBtn();
      loadHistory();
    };

    document.querySelectorAll('.kpi').forEach(k => k.onclick = () => {
      kpiFilter = kpiFilter === k.dataset.kpi ? '' : k.dataset.kpi;
      draw();
    });
    $('clearKpi').onclick = () => { kpiFilter = ''; draw(); };
    ['fStatus', 'fPay', 'fCustomer', 'fStaff', 'fFrom', 'fTo'].forEach(id => $(id).onchange = draw);

    start();
  </script>
</body>
</html>
