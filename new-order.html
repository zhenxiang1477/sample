<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>新 Order</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Microsoft YaHei", sans-serif;
      background: #f6f7f9;
      color: #1f2937;
    }
    header {
      background: #fff;
      border-bottom: 1px solid #e5e7eb;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    header a { color: #2563eb; text-decoration: none; font-size: .95rem; }
    header h1 { font-size: 1.15rem; margin: 0; flex: 1; }
    main { max-width: 560px; margin: 0 auto; padding: 16px; }
    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 1px 3px rgba(0,0,0,.08);
      padding: 18px 16px;
      margin-bottom: 16px;
    }
    label { display: block; font-size: .9rem; margin: 14px 0 6px; font-weight: 500; }
    label:first-child { margin-top: 0; }
    input, select, textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 1rem;
      font-family: inherit;
      background: #fff;
    }
    input:focus, select:focus, textarea:focus { outline: 2px solid #2563eb; border-color: #2563eb; }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
    .hint { color: #6b7280; font-size: .85rem; margin: 4px 0 0; }
    .hint a { color: #2563eb; }
    .amount {
      margin-top: 16px;
      padding: 12px 14px;
      background: #f9fafb;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }
    .amount span { color: #4b5563; }
    .amount strong { font-size: 1.3rem; }
    button {
      width: 100%;
      margin-top: 18px;
      padding: 12px;
      border: 0;
      border-radius: 8px;
      background: #2563eb;
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: wait; }
    .msg { margin-top: 14px; padding: 12px; border-radius: 8px; font-size: .95rem; background: #fef2f2; color: #991b1b; }
    .msg.ok { background: #ecfdf5; color: #065f46; }
  </style>
</head>
<body>
  <header>
    <a href="index.html">← 主页</a>
    <h1>新 Order</h1>
  </header>

  <main hidden id="page">
    <form class="card" id="orderForm">
      <label for="customer">客户 *</label>
      <select id="customer" required>
        <option value="">— 选客户 —</option>
      </select>
      <p class="hint">找不到客户？先去 <a href="customers.html">客户页面</a> 新增。</p>

      <label for="item">货品 *</label>
      <input id="item" required maxlength="200" placeholder="例如 Cement 50kg">

      <div class="row2">
        <div>
          <label for="qty">数量 *</label>
          <input id="qty" type="number" inputmode="decimal" min="0.01" step="0.01" required>
        </div>
        <div>
          <label for="price">单价（RM）*</label>
          <input id="price" type="number" inputmode="decimal" min="0" step="0.01" required>
        </div>
      </div>

      <div class="amount"><span>金额</span><strong id="amount">RM 0.00</strong></div>

      <label for="promised">答应送货日期 *</label>
      <input id="promised" type="date" required>
      <p class="hint" id="promisedNice"></p>

      <label for="notes">备注</label>
      <textarea id="notes" rows="2" maxlength="500"></textarea>

      <button type="submit" id="saveBtn">开单</button>
      <p class="msg" id="msg" hidden></p>
    </form>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);

    async function start() {
      const me = await requireRole(['staff', 'manager', 'owner']);
      if (!me) return;

      const { data, error } = await sb.from('customers').select('id, name').order('name');
      if (error) {
        $('page').hidden = false;
        return showMessage($('msg'), friendlyError(error));
      }
      $('customer').insertAdjacentHTML('beforeend',
        data.map(c => '<option value="' + c.id + '">' + escapeHtml(c.name) + '</option>').join(''));
      if (!data.length) {
        showMessage($('msg'), '还没有客户。请先去客户页面新增客户。');
      }
      $('page').hidden = false;
    }

    function updateAmount() {
      const qty = Number($('qty').value) || 0;
      const price = Number($('price').value) || 0;
      $('amount').textContent = money(Math.round(qty * price * 100) / 100);
    }

    $('qty').oninput = updateAmount;
    $('price').oninput = updateAmount;
    $('promised').oninput = () => { $('promisedNice').textContent = niceDate($('promised').value); };

    $('orderForm').onsubmit = async (e) => {
      e.preventDefault();
      const msg = $('msg');
      const btn = $('saveBtn');
      const qty = Number($('qty').value);
      const price = Number($('price').value);

      if (!$('customer').value) return showMessage(msg, '请选客户。');
      if (!$('item').value.trim()) return showMessage(msg, '请填货品。');
      if (!(qty > 0)) return showMessage(msg, '数量要大过 0。');
      if (!(price >= 0)) return showMessage(msg, '单价不能是负数。');
      if (!$('promised').value) return showMessage(msg, '请选答应送货日期。');

      btn.disabled = true;
      showMessage(msg, '');
      const { data, error } = await sb.from('orders').insert({
        customer_id: $('customer').value,
        item: $('item').value.trim(),
        qty,
        unit_price: price,
        promised_date: $('promised').value,
        notes: $('notes').value.trim() || null,
      }).select('order_no, amount, promised_date').single();
      btn.disabled = false;

      if (error) return showMessage(msg, friendlyError(error));

      const customerName = $('customer').selectedOptions[0].textContent;
      $('orderForm').reset();
      updateAmount();
      $('promisedNice').textContent = '';
      showMessage(msg,
        '✅ 开单成功！' + data.order_no + ' · ' + customerName + ' · ' + money(data.amount)
        + ' · 送货 ' + niceDate(data.promised_date), 'ok');
    };

    start();
  </script>
</body>
</html>
